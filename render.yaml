services:
  - type: web
    name: ai-governance-dashboard
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-governance-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: ai-governance-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false        # Set manually to your Render public URL after first deploy
      - key: APP_URL
        sync: false        # Same as NEXTAUTH_URL
      - key: SEED_PASSWORD
        sync: false        # Password for seeded demo accounts

databases:
  - name: ai-governance-db
    region: oregon
    plan: free
    databaseName: ai_governance
    user: ai_governance_user
